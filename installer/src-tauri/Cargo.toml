[package]
name = "pulse-setup"
version = "1.0.0"
description = "Pulse Setup — installer and uninstaller for the Pulse music player"
edition = "2021"
license = "GPL-3.0"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
